version: "3.9"

services:
  app_1:
    image: yashashavgoyal/chronicle:latest
    container_name: chronicle-e1
    expose:
      - "3000"
    restart: always

  app_2:
    image: yashashavgoyal/chronicle:latest
    container_name: chronicle-e2
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: chronicle-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_1
      - app_2
    restart: always
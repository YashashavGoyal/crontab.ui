name: Chronicle CI/CD - Test Build Deploy

# Event when to trigger
on:
  push:
    branches:
      - main

    tags:
      - "v*"

  # Manual Trigger for Testing
  # Input will decide if we want to deploy or not
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:

  # Test the Code - Initialy eslint only
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run lint

  # Build Docker Image with all necessary info and push it in docker hub
  build:
    runs-on: ubuntu-latest
    needs: test

    # export output
    outputs:
      sha_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login Credential
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: yashashavgoyal/chronicle

          # Define tags 
          # semver is for version tags - only when tag is pushed
          # raw is for latest tag
          # sha is for short sha tag - you can see it using git 
          # git rev-parse --short HEAD
          tags: |
            type=sha,format=short
            type=raw,value=latest
            type=semver,pattern={{version}} 
          labels: |
            org.opencontainers.image.authors=Yashashav Goyal

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

  # Deploy on AWS EC2 - ubuntu machine
  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Here I want Continous Delivery - that means manual approval is required
    # So In environment's protection rules, I will add a rule that manual approval is required
    environment:
      name: production

    # This is to run this job only when push with manual approval or workflow_dispatch with deploy is true
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure aws-cli
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # dynamically fetch public-ipv4 of all ec2 tagged {app: chronicle}
      - name: Discover EC2 instances dynamically
        run: |
          EC2_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=chronicle" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text)

          echo "EC2_IPS=$EC2_IPS" >> $GITHUB_ENV

      # Configure ssh to all ipv4 fetched by aws-cli
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_IPS >> ~/.ssh/known_hosts

      # Deploy to all ipv4 fetched by aws-cli
      # One by One
      - name: Deploy to EC2
        run: |
          for EC2 in $EC2_IPS; do
            echo "Deploying to $EC2..."
            
            # Create directory
            ssh -o StrictHostKeyChecking=no ubuntu@$EC2 "mkdir -p /home/ubuntu/chronicle/Config"
            
            # Copy Config files
            scp -o StrictHostKeyChecking=no -r Config/* ubuntu@$EC2:/home/ubuntu/chronicle/Config/
            
            # Setup Docker if needed
            ssh -o StrictHostKeyChecking=no ubuntu@$EC2 "chmod +x /home/ubuntu/chronicle/Config/docker-setup.sh && /home/ubuntu/chronicle/Config/docker-setup.sh"
            
            # Run App Setup
            ssh -o StrictHostKeyChecking=no ubuntu@$EC2 "chmod +x /home/ubuntu/chronicle/Config/app_setup.sh && /home/ubuntu/chronicle/Config/app_setup.sh $EC2 ${{ needs.build.outputs.sha_tag }}"
            
          done
